name: Collect forex data

on:
  schedule:
    # 22:17 UTC daily (after the NY close). Weekend runs simply add nothing.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --upgrade yfinance pandas

      - name: Fetch
        run: python fetch_forex.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Forex data $(date -u +%Y-%m-%d)"
            git push
          fi
