name: Fetch pairs now (Yahoo 1m/1h/daily)
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Pairs, space separated (e.g. EURUSD EURJPY)"
        default: "EURUSD EURJPY"
permissions: {contents: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --upgrade yfinance "pandas<3"
      - run: python fetch_forex.py ${{ inputs.pairs }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Fetch ${{ inputs.pairs }} $(date -u +%Y-%m-%dT%H:%M)" && git pull --rebase && git push)
