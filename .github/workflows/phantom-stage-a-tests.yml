name: Phantom Stage A tests

on:
  pull_request:
    paths:
      - "scripts/backtest_phantom_stage_a.py"
      - "tests/**"
      - ".github/workflows/phantom-stage-a-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
