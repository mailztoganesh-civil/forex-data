name: Backfill index CFDs 5m (Dukascopy US30 + NAS100)
# US30 (USA30IDXUSD) = YM proxy, NAS100 (USATECHIDXUSD) = NQ proxy. Output data/<PAIR>/5m/YYYY.csv (UTC).
# Resume run 3 (US30 2025 retry): one job per pair-year in parallel (Dukascopy throttles a single runner).
on:
  push:
    branches: [stoic-index-data]
    paths: [.github/workflows/indices-backfill.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {pair: USA30IDXUSD, from: "2025-01-01", to: "2025-12-31"}
    env: {TIME_BUDGET_MIN: "180", WORKERS: "2", RETRIES: "6", FROM_DATE: "${{ matrix.from }}", TO_DATE: "${{ matrix.to }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas
      - name: Fetch
        run: mkdir -p logs; python -u fetch_dukascopy.py 2600 ${{ matrix.pair }} 2>&1 | tee logs/${{ matrix.pair }}_${{ matrix.from }}.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data logs
          git diff --cached --quiet && exit 0
          git commit -m "Index 5m ${{ matrix.pair }} ${{ matrix.from }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
