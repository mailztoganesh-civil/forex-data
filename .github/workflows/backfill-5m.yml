name: Backfill 5m OHLC (HistData)
on:
  workflow_dispatch:
    inputs:
      start_year: {description: "Start year", default: "2025"}
      pair: {description: "Pair", default: "EURUSD"}
permissions: {contents: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas
      - run: python -u fetch_histdata.py ${{ inputs.start_year }} ${{ inputs.pair }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No new data" || (git commit -m "5m backfill ${{ inputs.pair }} $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
