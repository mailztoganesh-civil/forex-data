name: BTC intraday Zero Lag research (M5/M15/M30)
on:
  workflow_dispatch:
    inputs:
      cost_pct:
        description: "Round-trip cost, % of price (spread + slippage)"
        default: "0.06"
permissions: {contents: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: pip install --upgrade "pandas<3" numpy tabulate matplotlib reportlab
      - name: Fetch BTC 5-min history (Binance archive)
        run: python scripts/fetch_btc_binance.py 2017-08
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/BTCUSD/5m
          git diff --cached --quiet || (git commit -m "BTC 5m data $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
      - name: Research
        run: |
          if [ -f scripts/zl_intraday_research.py ]; then
            python scripts/zl_intraday_research.py --cost-pct "${{ inputs.cost_pct }}" --out results/btc/intraday
            cat results/btc/intraday/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit results
        run: |
          git add results
          git diff --cached --quiet || (git commit -m "BTC intraday Zero Lag research $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
