name: Collect forex data
on: {schedule: [{cron: "17 22 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs: {collect: {runs-on: ubuntu-latest, timeout-minutes: 20, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.12"}}, {name: Install, run: "pip install --upgrade yfinance pandas"}, {name: Fetch, run: "python fetch_forex.py"}, {name: Commit, run: 'git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add data && (git diff --cached --quiet && echo "No new data" || (git commit -m "Forex data $(date -u +%Y-%m-%d)" && git push))'}]}}
